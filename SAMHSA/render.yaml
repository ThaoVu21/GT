services:
  - type: web
    name: client-profile-explorer
    runtime: python
    rootDir: SAMHSA
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn profile_explorer_dash:server --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
